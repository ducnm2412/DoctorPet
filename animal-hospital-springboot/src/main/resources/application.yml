spring:
  application:
    name: animalHospital

  datasource:
    # Giá trị mặc định dùng cho máy local; khi deploy set qua biến môi trường
    url: ${DB_URL:jdbc:mysql://localhost:3306/animalhospital?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  cors:
    # Danh sách origin của frontend, phân tách bằng dấu phẩy
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      base-path: /management # khớp với các rule trong SecurityConfiguration
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  # Secret mặc định chỉ dùng cho local - profile prod bắt buộc set JWT_SECRET
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 2592000

ai:
  provider: gemini # openai, gemini
  api-key: ${GEMINI_API_KEY:} # Gemini API key - set qua biến môi trường, không commit key vào code
  api-url: ${AI_API_URL:} # Optional, defaults to provider's default URL
  model: gemini-2.0-flash-001 # Model name - Stable version, có generateContent trong v1beta API
  max-tokens: 1000
  temperature: 0.8 # Tăng lên để response tự nhiên hơn (0.7-0.9 là tốt cho conversation tự nhiên)
  timeout: 30 # seconds
  enabled: ${AI_ENABLED:false} # false = dùng fallback (knowledge from database)

logging:
  level:
    root: INFO
    com.docpet.animalhospital: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
